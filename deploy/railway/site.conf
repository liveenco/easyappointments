<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    Alias "/healthz" "/var/www/html/healthz.php"

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Include /etc/apache2/easyappointments-access.conf
    </Directory>

    <DirectoryMatch "^/var/www/html/(application|system|vendor|storage)(/|$)">
        Require all denied
    </DirectoryMatch>

    <Files "config.php">
        Require all denied
    </Files>

    <LocationMatch "^/healthz$">
        Require all granted
    </LocationMatch>
</VirtualHost>
